[defaults]
# cEOS nodes are rebuilt constantly in a lab; host key churn is noise here.
# Do NOT carry this setting into anything resembling production.
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = yaml
retry_files_enabled = False

[persistent_connection]
# network_cli against cEOS can be slow to establish on first connect,
# especially on a laptop running the devices alongside Kubernetes.
command_timeout = 60
connect_timeout = 60
