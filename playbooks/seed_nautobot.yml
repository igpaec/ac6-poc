---
# Stage 1a — populate Nautobot with the Stage 0 topology.
#
# WHAT THIS IS: an ordinary Ansible playbook, but a different shape from
# configure_base.yml. It runs against `localhost` and talks to Nautobot's REST
# API through the networktocode.nautobot modules. It never touches leaf1/leaf2 —
# the devices don't even need to be running.
#
# HOW TO RUN:
#   export NAUTOBOT_URL="http://localhost:8080"
#   export NAUTOBOT_TOKEN="<your-token>"
#   ansible-playbook playbooks/seed_nautobot.yml
#
# No -i inventory needed: the play targets localhost. No -u/-k either: auth is
# the Nautobot API token, not SSH.
#
# It is idempotent — safe to re-run. That matters, because you will iterate on
# it, and because it is the seed of the eventual `reset.sh` for Lab 1.
#
# ORDER MATTERS. Nautobot enforces referential integrity, so parents come first:
#   LocationType → Location → Manufacturer → Platform → DeviceType → Role
#   → Device → Interface → Prefix → IPAddress → bind IP → set primary_ip4

- name: Seed Nautobot with the POC topology
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # YAML anchor: the collection defines no module_defaults action group, so
    # url/token must be passed to every task. `<<: *nb` merges them in.
    nb: &nb
      url: "{{ lookup('env', 'NAUTOBOT_URL') }}"
      token: "{{ lookup('env', 'NAUTOBOT_TOKEN') }}"

    site_name: DC1
    mgmt_prefix: 172.20.20.0/24
    mgmt_interface: Management0

    # Nautobot clones this itself to discover the Jobs in jobs/ — so it must be
    # a URL Nautobot's worker can reach, not a local path.
    lab_repo_url: https://github.com/igpaec/ac6-poc.git
    lab_repo_branch: main

    # These MUST match clab/poc.clab.yml's pinned mgmt-ipv4 values, and the
    # literals printed in the attendee labs. Lab 1's dynamic inventory builds
    # ansible_host from primary_ip4, so a mismatch here sends every playbook to
    # the wrong address — with no error that says so.
    #
    # Corrected 2026-08-26: these were .3 and .2, copied from an unpinned
    # ContainerLab run where the nodes came up in reverse order.
    poc_devices:
      - name: leaf1
        mgmt_ip: 172.20.20.11/24
      - name: leaf2
        mgmt_ip: 172.20.20.12/24

    # ---------------------------------------------------------- Lab 2 content
    # Same keys as inventory/group_vars/leaf.yml, deliberately. Lab 2 deletes
    # that file and the playbook keeps working because Nautobot serves these
    # instead — which is the whole point of the lab.
    leaf_base_context:
      ntp_servers:
        - 10.0.0.1
        - 10.0.0.2
      dns_servers:
        - 10.0.0.53
      snmp_community: public
      mgmt_vrf: MGMT
      syslog_host: 10.0.0.10

    # JSON Schema for the above. Lab 2d has the attendee set ntp_servers to a
    # plain string and watch Nautobot refuse it, so the array constraint is the
    # part that has to bite.
    leaf_base_schema:
      title: leaf-base
      type: object
      properties:
        ntp_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: ipv4
        dns_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: ipv4
        snmp_community:
          type: string
          minLength: 1
        mgmt_vrf:
          type: string
        syslog_host:
          type: string
          format: ipv4
      required:
        - ntp_servers

  tasks:
    - name: Fail early if credentials are missing
      ansible.builtin.assert:
        that:
          - nautobot_url | default(lookup('env', 'NAUTOBOT_URL'), true) | length > 0
          - lookup('env', 'NAUTOBOT_TOKEN') | length > 0
        fail_msg: >-
          NAUTOBOT_URL and NAUTOBOT_TOKEN must be exported. See the header of
          this file.

    # ----------------------------------------------- custom fields (Stage 3)
    # Schema setup, so it belongs here rather than in the write-back playbook.
    # Nautobot 2.x+ uses `key` (the old `slug`) as the programmatic name — that
    # is what `custom_fields:` refers to when writing values.
    - name: Custom field — AWX job ID
      networktocode.nautobot.custom_field:
        <<: *nb
        key: awx_job_id
        label: AWX Job ID
        type: text
        content_types:
          - dcim.device
        description: >-
          Set by playbooks/write_back.yml. Links this device to the AWX job that
          last touched it — the correlation Lab 4 closes the loop on.
        state: present

    - name: Custom field — discovered LLDP neighbors
      networktocode.nautobot.custom_field:
        <<: *nb
        key: lldp_neighbors
        label: LLDP Neighbors (discovered)
        type: json
        content_types:
          - dcim.device
        description: >-
          Discovered at runtime and written back. A JSON field rather than real
          Cable objects on purpose — see write_back.yml for the reasoning.
        state: present

    # ---------------------------------------------------------------- location
    - name: Location type
      networktocode.nautobot.location_type:
        <<: *nb
        name: Site
        content_types:
          - dcim.device
        state: present

    - name: Location
      networktocode.nautobot.location:
        <<: *nb
        name: "{{ site_name }}"
        location_type: Site
        status: Active
        state: present

    # ------------------------------------------------------------ device model
    - name: Manufacturer
      networktocode.nautobot.manufacturer:
        <<: *nb
        name: Arista
        state: present

    - name: Platform
      networktocode.nautobot.platform:
        <<: *nb
        name: Arista EOS
        manufacturer: Arista
        # netutils driver name. Stage 1b's inventory `compose:` should read the
        # Ansible mapping off this rather than using the raw value — see the
        # note in tutorial.md Stage 1b about network_driver_mappings.
        network_driver: arista_eos
        state: present

    - name: Device type
      networktocode.nautobot.device_type:
        <<: *nb
        model: cEOSLab
        manufacturer: Arista
        u_height: 1
        state: present

    # Registered: the Config Context below scopes itself to this role and needs
    # its UUID. The module returns the object whether it created it or found it
    # already there, so this is safe on a re-run.
    - name: Role
      networktocode.nautobot.role:
        <<: *nb
        name: leaf
        content_types:
          - dcim.device
        state: present
      register: role_leaf

    # ----------------------------------------------------------------- devices
    - name: Devices
      networktocode.nautobot.device:
        <<: *nb
        name: "{{ item.name }}"
        device_type: cEOSLab
        role: leaf
        platform: Arista EOS
        location: "{{ site_name }}"
        status: Active
        state: present
      loop: "{{ poc_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # -------------------------------------------------------------------- IPAM
    # IPAM comes BEFORE the interfaces, because the interface task binds the
    # addresses inline and they must already exist.
    #
    # Nautobot 2.x+ scopes IPs inside a Namespace. "Global" ships by default.
    - name: Management prefix
      networktocode.nautobot.prefix:
        <<: *nb
        prefix: "{{ mgmt_prefix }}"
        namespace: Global
        status: Active
        state: present

    - name: Management IP addresses
      networktocode.nautobot.ip_address:
        <<: *nb
        address: "{{ item.mgmt_ip }}"
        namespace: Global
        status: Active
        state: present
      loop: "{{ poc_devices }}"
      loop_control:
        label: "{{ item.mgmt_ip }}"

    # Interface creation AND IP binding in one task.
    #
    # Do NOT use networktocode.nautobot.ip_address_to_interface here: it is
    # deprecated in 6.2.0 (removal in 7.0.0) and it has no `device` parameter,
    # so there is no way to disambiguate "Management0 on leaf1" from
    # "Management0 on leaf2". The `ip_addresses` option below replaces it and
    # was added in exactly 6.2.0.
    #
    # `ip_addresses` is a DICT, not a list:
    #   state:   merge (default) | replace | delete
    #   objects: list of dicts, each with an `ip_address` key
    - name: Management interfaces (with IPs bound)
      networktocode.nautobot.device_interface:
        <<: *nb
        device: "{{ item.name }}"
        name: "{{ mgmt_interface }}"
        type: 1000base-t
        mgmt_only: true
        status: Active
        ip_addresses:
          state: merge
          objects:
            - ip_address: "{{ item.mgmt_ip }}"
        state: present
      loop: "{{ poc_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # Must come last: the IP has to exist and be bound before it can be primary.
    # Stage 1b's dynamic inventory reads primary_ip4 to build ansible_host, so
    # if this task fails, Lab 1 produces hosts with no address.
    - name: Set primary IPv4
      networktocode.nautobot.device:
        <<: *nb
        name: "{{ item.name }}"
        primary_ip4: "{{ item.mgmt_ip }}"
        state: present
      loop: "{{ poc_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # ------------------------------------------- Dynamic Group (Lab 1c)
    # Nautobot 3.x requires group_type. `dynamic-filter` is the one whose
    # membership is computed from `filter` — the other two are `static` and
    # `dynamic-set`, neither of which is what Lab 1c demonstrates.
    #
    # Note the filter values are LISTS. Nautobot's filter syntax mirrors the
    # REST API's query parameters, where every value is multi-valued.
    - name: Dynamic Group — leaf devices at DC1
      networktocode.nautobot.dynamic_group:
        <<: *nb
        name: leaf-devices-dc1
        group_type: dynamic-filter
        content_type: dcim.device
        description: >-
          Lab 1c targets this group by name. Membership is a live query, not a
          list — add a device matching the filter and it appears here.
        filter:
          role:
            - leaf
          location:
            - "{{ site_name }}"
        state: present

    # ------------------------------------------- Config Context (Lab 2)
    # No collection module exists for Config Contexts or their Schemas in
    # networktocode.nautobot 6.2.0 — only `dynamic_group`. So these two go
    # through the REST API directly.
    #
    # Field names verified against Nautobot 3.2.3's models:
    #   ConfigContextSchema: name, description, data_schema
    #   ConfigContext:       name, weight, description, is_active, data,
    #                        config_context_schema, and M2M scopes including
    #                        `roles` (extras.Role, not a dcim device role)
    #
    # Both are idempotent by name: query first, then POST or PATCH.
    - name: Look up the Config Context Schema
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/config-context-schemas/?name=leaf-base-schema"
        method: GET
        headers: &nb_headers
          Authorization: "Token {{ nb.token }}"
          Accept: application/json
        status_code: 200
      register: schema_lookup

    - name: Config Context Schema — leaf-base-schema
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/config-context-schemas/{{
          (schema_lookup.json.results | first).id ~ '/' if schema_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if schema_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: leaf-base-schema
          description: >-
            Validates leaf-base. Lab 2d proves this rejects a bad ntp_servers
            before it can reach a device.
          data_schema: "{{ leaf_base_schema }}"
        status_code: [200, 201]
      register: schema_result

    - name: Look up the Config Context
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/config-contexts/?name=leaf-base"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: context_lookup

    - name: Config Context — leaf-base
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/config-contexts/{{
          (context_lookup.json.results | first).id ~ '/' if context_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if context_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: leaf-base
          weight: 1000
          is_active: true
          description: >-
            Serves the variables that inventory/group_vars/leaf.yml used to
            hold. Scoped to the role, not to devices — any new leaf inherits it.
          config_context_schema: "{{ schema_result.json.id }}"
          # Scope. This is what makes Lab 2's point: attached to a rule, not a device.
          roles:
            - "{{ role_leaf.role.id }}"
          data: "{{ leaf_base_context }}"
        status_code: [200, 201]

    # ------------------------------------------- Secrets Group (Lab 3c)
    # Lab 3c asks attendees to compare Nautobot's way of holding device
    # credentials with AWX's, and to decide which should own them. Without a
    # Secrets Group to look at, one side of that comparison is an empty list.
    #
    # Deliberately an ENVIRONMENT-VARIABLE secret, not a literal: the lesson is
    # that Nautobot stores a *reference* to a secret and binds it to a device —
    # it does not store the secret itself. The variable need not exist for the
    # object to be worth looking at.
    - name: Secret — device password reference
      networktocode.nautobot.secret:
        <<: *nb
        name: cEOS admin password
        provider: environment-variable
        parameters:
          variable: NAPALM_PASSWORD
        description: >-
          A pointer, not a password. Nautobot resolves this at use time from the
          worker's environment — the value never lives in the database.
        state: present

    - name: Secrets Group — cEOS device access
      networktocode.nautobot.secrets_group:
        <<: *nb
        name: cEOS device access
        description: >-
          Lab 3c compares this with the AWX Machine credential. Same job, two
          places it could live — see the lab for why picking one matters.
        state: present

    - name: Bind the secret into the group
      networktocode.nautobot.secrets_groups_association:
        <<: *nb
        secrets_group: cEOS device access
        secret: cEOS admin password
        access_type: Generic
        secret_type: password
        state: present

    # ------------------------------------------- Git Repository + Jobs (Lab 3a)
    # This is what puts the "Run in AWX" button on a device page.
    #
    # There is no git_repository module in networktocode.nautobot 6.2.0, so the
    # repository goes through the REST API — same look-then-POST-or-PATCH shape
    # as the Config Context above. Field names verified against Nautobot 3.2.3's
    # GitRepository model: name, remote_url, branch, provided_contents.
    - name: Look up the Git Repository
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/git-repositories/?name=ac6-poc"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: repo_lookup

    - name: Git Repository — the lab repo, providing jobs
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/git-repositories/{{
          (repo_lookup.json.results | first).id ~ '/' if repo_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if repo_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: ac6-poc
          remote_url: "{{ lab_repo_url }}"
          branch: "{{ lab_repo_branch }}"
          provided_contents:
            - extras.job
        status_code: [200, 201]
      register: repo_result

    # Sync is a POST to the repository's /sync/ action. It enqueues a background
    # job, so the Jobs below do not exist the instant this returns.
    - name: Sync the Git Repository
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/git-repositories/{{ repo_result.json.id }}/sync/"
        method: POST
        headers: *nb_headers
        status_code: [200, 201, 202]

    - name: Wait for the Job to be imported
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/jobs/?name=Launch%20AWX%20job%20for%20this%20device"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: job_lookup
      until: job_lookup.json.count > 0
      retries: 12
      delay: 5

    # 🔴 Jobs import DISABLED. Nautobot will not run one until this is flipped,
    # and the failure is silent from the button's point of view.
    - name: Enable the Job
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/jobs/{{ (job_lookup.json.results | first).id }}/"
        method: PATCH
        headers: *nb_headers
        body_format: json
        body:
          enabled: true
        status_code: 200

    - name: Job Button — Run in AWX
      networktocode.nautobot.job_button:
        <<: *nb
        name: Run in AWX
        content_types:
          - dcim.device
        job: Launch AWX job for this device
        text: Run in AWX
        button_class: primary
        enabled: true
        confirmation: false
        state: present

    # ------------------------------------------------------------ verification
    - name: Next step
      ansible.builtin.debug:
        msg: >-
          Seeded {{ poc_devices | length }} devices at {{ site_name }},
          plus Config Context leaf-base (schema-validated) and Dynamic Group
          leaf-devices-dc1. Verify:
          ansible-inventory -i inventory/nautobot.yml --graph
          then: ansible-inventory -i inventory/nautobot.yml --host leaf1 | jq '.ntp_servers'
