---
# Stage 1b — the Nautobot dynamic inventory that replaces static.ini.
#
# HOW TO USE (locally):
#   export NAUTOBOT_URL="http://localhost:8080"
#   export NAUTOBOT_TOKEN="<token>"
#   ansible-inventory -i inventory/nautobot.yml --graph
#   ansible-inventory -i inventory/nautobot.yml --host leaf1
#
# Then the payoff — the SAME playbook, unchanged, against the new inventory:
#   ansible-playbook -i inventory/nautobot.yml playbooks/configure_base.yml \
#     -u admin -k --check --diff
#
# NOTE: api_endpoint and token are deliberately NOT written here. Both options
# read environment variables natively (NAUTOBOT_URL / NAUTOBOT_TOKEN), which
# keeps the token out of git AND lets the same file work in two places: locally
# it points at localhost, while in AWX a custom credential injects a URL that is
# reachable from inside the cluster.

plugin: networktocode.nautobot.inventory

validate_certs: false

# Pull Config Contexts into hostvars. Defaults to False — Lab 2 depends on this
# being on, so it is enabled from the start.
config_context: true

# ---------------------------------------------------------------- group naming
#
# These two options together decide what the groups are CALLED, which decides
# whether inventory/group_vars/leaf.yml still applies. Getting them wrong is the
# most likely reason Lab 1 "works" but variables silently stop resolving.
#
# plurals: true (the DEFAULT) does two things you probably don't want:
#   1. group_by choices must be plural (device_roles, locations, platforms)
#   2. every hostvar is wrapped in a single-element array, for legacy
#      compatibility with very old versions of this plugin
# Setting it false gives modern, unwrapped hostvars and singular group_by names.
plurals: false

# group_names_raw: true drops the "role_" / "location_" prefix from group names,
# so the role group is literally `leaf` rather than `role_leaf`.
#
# THIS IS WHAT KEEPS inventory/group_vars/leaf.yml WORKING. With the default
# (false) the group would be `role_leaf`, group_vars/leaf.yml would match
# nothing, and the play would fail its assert with no obvious cause.
group_names_raw: true

group_by:
  - location
  - role
  - platform

# ------------------------------------------------------------------- host vars
#
# compose values are Jinja2 EXPRESSIONS, so literal strings need inner quotes.
compose:
  # primary_ip4.address is CIDR ("172.20.20.3/24"); Ansible wants the bare
  # address. Plain Jinja split avoids depending on ipaddr/netaddr.
  ansible_host: primary_ip4.address.split('/')[0]

  # Set explicitly rather than derived from platform.network_driver: that field
  # holds the netutils name ("arista_eos"), not the Ansible module namespace
  # ("arista.eos.eos"). Nautobot exposes network_driver_mappings.ansible for the
  # translation, but whether this plugin surfaces it is unverified — so these are
  # literals until that is confirmed.
  ansible_network_os: "'arista.eos.eos'"
  ansible_connection: "'ansible.netcommon.network_cli'"
  ansible_become: true
  ansible_become_method: "'enable'"

# ---------------------------------------------------------------------- filters
#
# Restrict to active devices. Commented out pending a format check: the option
# is declared `elements: str`, so entries are query-string fragments
# ("status=active"), NOT the `- status: active` mapping form used by some other
# inventory plugins. Enable once verified against your Nautobot.
#
# device_query_filters:
#   - "status=active"
